<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>智租云 - 智能融资租赁合同系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8fafc;
      }
      /* Custom scrollbar for contract view */
      .custom-scrollbar::-webkit-scrollbar {
        width: 8px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #f1f1f1;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      /* Professional Paper Document Styling */
      .paper-document {
        font-family: 'Noto Serif SC', serif;
        line-height: 1.8;
        color: #1e293b;
      }
      .paper-document h1 { 
        font-size: 24px; 
        text-align: center; 
        font-weight: 700; 
        margin-bottom: 30px; 
        margin-top: 10px; 
      }
      .paper-document h2 { 
        font-size: 18px; 
        font-weight: 700; 
        margin-top: 24px; 
        margin-bottom: 12px; 
        border-bottom: 1px solid #e2e8f0; 
        padding-bottom: 4px;
      }
      .paper-document h3 { 
        font-size: 16px; 
        font-weight: 600; 
        margin-top: 16px; 
        margin-bottom: 8px; 
      }
      .paper-document p { 
        margin-bottom: 12px; 
        text-align: justify; 
      }
      .paper-document ul, .paper-document ol { 
        margin-bottom: 12px; 
        padding-left: 24px; 
      }
      .paper-document ul { list-style-type: disc; }
      .paper-document ol { list-style-type: decimal; }
      .paper-document strong { font-weight: 700; color: #000; }

      /* AI Analysis Markdown Styling */
      .analysis-body h1 { font-size: 1.5em; font-weight: bold; margin-bottom: 0.5em; }
      .analysis-body h2 { font-size: 1.1em; font-weight: 600; margin-top: 1em; color: #1e40af; }
      .analysis-body ul { list-style-type: disc; padding-left: 1.5em; margin-bottom: 1em; }
      .analysis-body p { margin-bottom: 0.8em; }

      @media print {
        body { background: white; }
        /* Hide everything that isn't the contract content */
        .no-print { display: none !important; }
        
        /* Reset containers for printing */
        #root, main, .max-w-7xl, .lg\:col-span-7, .bg-white { 
            max-width: 100% !important; 
            width: 100% !important; 
            margin: 0 !important; 
            padding: 0 !important; 
            box-shadow: none !important;
            border: none !important;
            background: white !important;
            height: auto !important;
            overflow: visible !important;
        }
        
        .paper-document {
            font-size: 12pt;
            padding: 0 !important;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "react-markdown": "https://aistudiocdn.com/react-markdown@^10.1.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
